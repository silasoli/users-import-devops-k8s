name: Docker Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag opcional para publicar a imagem (ex.: v1.0.0)"
        required: false
        default: ""

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/users-import-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Define tags
        id: tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
            if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
              echo "${IMAGE_NAME}:${{ inputs.image_tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
