apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: users-import
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: users-import-dashboards
        orgId: 1
        folder: Users Import
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards


